<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover Three</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1512;
    --panel:#161F1A;
    --panel-2:#1C2620;
    --panel-3:#22302A;
    --line:#2B362F;
    --line-soft:#202B25;
    --chalk:#F3F0E6;
    --muted:#8FA096;
    --muted-2:#5E6E65;
    --gold:#E3B341;
    --gold-soft:#3A331B;
    --win:#5FA776;
    --win-soft:#16261B;
    --loss:#C1554A;
    --loss-soft:#2A1917;
    --pending:#7A8B95;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Anton',sans-serif; letter-spacing:0.01em; text-transform:uppercase;}

  /* hash-mark divider, used sparingly */
  .hashline{
    height:1px;
    background-image:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 14px);
    margin:0;
  }

  header.top{
    position:sticky; top:0; z-index:20;
    background:rgba(14,21,18,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .topwrap{
    max-width:1040px; margin:0 auto; padding:14px 20px 0 20px;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    font-family:'Anton',sans-serif; font-size:26px; letter-spacing:0.02em;
    color:var(--chalk); text-transform:uppercase; line-height:1;
  }
  .brand .mark span{color:var(--gold);}
  .brand .sub{color:var(--muted-2); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;}

  nav.tabs{max-width:1040px; margin:10px auto 0 auto; padding:0 20px; display:flex; gap:4px;}
  nav.tabs button{
    background:none; border:none; color:var(--muted);
    font-family:'Anton',sans-serif; font-size:14px; letter-spacing:0.06em; text-transform:uppercase;
    padding:10px 14px 12px 14px; cursor:pointer; border-bottom:2px solid transparent;
  }
  nav.tabs button.active{color:var(--gold); border-bottom-color:var(--gold);}
  nav.tabs button:hover{color:var(--chalk);}

  main{max-width:1040px; margin:0 auto; padding:22px 20px 80px 20px;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Anton',sans-serif; font-size:19px; letter-spacing:0.03em; text-transform:uppercase;
    margin:0 0 4px 0; color:var(--chalk);
  }
  .card .eyebrow{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold);
    margin:0 0 10px 0; font-weight:600;
  }
  .card p.hint{color:var(--muted); font-size:13px; margin:2px 0 14px 0; line-height:1.5;}

  select, input[type=number], input[type=text]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--chalk);
    border-radius:4px; padding:8px 10px; font-family:'Inter',sans-serif; font-size:14px;
  }
  select:focus, input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:5px;}

  .row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}

  button.btn{
    background:var(--gold); color:#1A1508; border:none; border-radius:4px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px;
    padding:10px 16px; cursor:pointer; letter-spacing:0.02em;
  }
  button.btn:hover{filter:brightness(1.08);}
  button.btn.ghost{
    background:transparent; color:var(--gold); border:1px solid var(--gold-soft);
  }
  button.btn.ghost:hover{background:var(--gold-soft);}
  button.btn:disabled{opacity:0.4; cursor:not-allowed;}
  button.linklike{
    background:none;border:none;color:var(--muted);text-decoration:underline;
    cursor:pointer;font-size:12px;padding:0;
  }
  button.linklike:hover{color:var(--chalk);}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted-2); padding:6px 8px; border-bottom:1px solid var(--line); font-weight:600;
  }
  td{padding:9px 8px; border-bottom:1px solid var(--line-soft);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}

  .pill{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
    font-weight:600; letter-spacing:0.02em;
  }
  .pill.win{background:var(--win-soft); color:var(--win);}
  .pill.loss{background:var(--loss-soft); color:var(--loss);}
  .pill.pending{background:#1D2528; color:var(--pending);}
  .pill.gold{background:var(--gold-soft); color:var(--gold);}

  /* game setup grid */
  .setup-row{
    display:grid; grid-template-columns: 1fr 1fr 90px 70px 70px 34px;
    gap:8px; align-items:center; margin-bottom:8px;
  }
  .setup-row input{width:100%;}
  .setup-row .del{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:16px;}
  .setup-row .del:hover{color:var(--loss);}
  .setup-head{
    display:grid; grid-template-columns: 1fr 1fr 90px 70px 70px 34px; gap:8px;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted-2);
    margin-bottom:6px;
  }

  /* point meter — signature element */
  .meter-wrap{margin:6px 0 18px 0;}
  .meter-readout{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;
  }
  .meter-readout .label{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);}
  .meter-readout .value{font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--chalk);}
  .meter-readout .value .of{color:var(--muted-2); font-size:14px;}
  .chain{display:flex; gap:3px;}
  .chip{
    flex:1; height:14px; background:var(--panel-3); border-radius:2px;
    border-top:1px solid rgba(255,255,255,0.03);
  }
  .chip.filled{background:var(--gold);}
  .chip.over{background:var(--loss);}

  /* pick card per game */
  .game{
    border:1px solid var(--line); border-radius:6px; padding:14px; margin-bottom:10px;
    background:var(--panel-2);
  }
  .game .matchup{display:flex; gap:10px; margin-bottom:10px;}
  .side{
    flex:1; text-align:left; background:var(--panel-3); border:1px solid var(--line);
    border-radius:4px; padding:10px 12px; cursor:pointer; transition:border-color .12s;
  }
  .side:hover{border-color:var(--gold-soft);}
  .side.selected{border-color:var(--gold); background:var(--gold-soft);}
  .side .team{font-weight:700; font-size:15px;}
  .side .line{font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:12px; margin-top:2px;}
  .side.selected .line{color:var(--gold);}
  .conf-row{display:flex; align-items:center; gap:10px;}
  .conf-row label{margin:0; white-space:nowrap;}
  .conf-row input{width:70px;}
  .game .status{margin-left:auto; font-size:12px;}
  .game.decided .side{cursor:default;}

  /* week board — one row per game, one column per person */
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px;}
  .board{min-width:640px;}
  .board th.person{text-align:left; color:var(--muted-2);}
  .board td.matchup{line-height:1.35;}
  .board td.matchup .at{color:var(--muted-2); margin:0 3px;}
  .board td.matchup .covered{color:var(--gold); font-weight:700;}
  .board td.line{font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:13px; white-space:nowrap;}
  .board td.result{font-family:'IBM Plex Mono',monospace; font-size:13px; white-space:nowrap; color:var(--muted);}
  .board td.pick{white-space:nowrap; font-size:13px;}
  .pickcell .team{font-weight:600; color:var(--chalk);}
  .pickcell .pts{font-family:'IBM Plex Mono',monospace; color:var(--muted-2); margin-left:5px;}
  .pickcell.won .team{color:var(--win);}
  .pickcell.won .pts{color:var(--win);}
  .pickcell.lost .team{color:var(--loss); text-decoration:line-through; text-decoration-thickness:1px;}
  .pickcell.none{color:var(--muted-2);}
  .board tr.decided td{background:rgba(255,255,255,0.012);}
  .board td.matchup .sub{
    display:none; font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--muted-2); margin-top:3px;
  }
  /* On a phone the table becomes one stacked block per game: matchup and line
     on top, the three picks side by side underneath. Team names are far too
     long to keep six columns on a 390px screen. */
  @media (max-width:720px){
    .scrollx{overflow-x:visible; margin:0; padding:0;}
    .board, .board tbody, .board tr, .board td{display:block;}
    .board{min-width:0;}
    .board thead{display:none;}
    .board tr{
      border:1px solid var(--line); border-radius:5px;
      padding:11px 12px 9px 12px; margin-bottom:8px; background:var(--panel-2);
    }
    .board tr.decided td{background:transparent;}
    .board td{border:none; padding:0;}
    .board td.matchup{font-size:14px; margin-bottom:9px;}
    .board td.matchup .sub{display:block;}
    .board td.line, .board td.result{display:none;}
    .board td.pick{
      display:inline-block; width:33.3%; vertical-align:top;
      font-size:12px; white-space:normal; padding-right:6px;
    }
    .board td.pick::before{
      content:attr(data-who); display:block; margin-bottom:2px;
      color:var(--muted-2); font-size:9px; letter-spacing:0.1em; text-transform:uppercase;
    }
    .wkline{gap:14px; font-size:12px;}
  }

  .wkline{
    display:flex; flex-wrap:wrap; gap:18px; align-items:baseline;
    font-size:13px; color:var(--muted); margin-top:2px;
  }
  .wkline .who{color:var(--chalk); font-weight:600;}
  .wkline .pts{font-family:'IBM Plex Mono',monospace; color:var(--gold); font-weight:600;}
  .wkline .lead{color:var(--gold);}

  .standing-row .rank{
    font-family:'Anton',sans-serif; font-size:20px; color:var(--muted-2); width:28px; display:inline-block;
  }
  .standing-row.lead .rank{color:var(--gold);}

  .barwrap{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .barwrap .name{width:52px; font-size:12px; color:var(--muted); flex-shrink:0;}
  .barwrap .track{flex:1; background:var(--panel-2); border-radius:3px; height:10px; overflow:hidden;}
  .barwrap .fill{height:100%; background:var(--gold); border-radius:3px;}
  .barwrap .amt{width:44px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:720px){
    .grid2{grid-template-columns:1fr;}
    .setup-row, .setup-head{grid-template-columns: 1fr 1fr 70px 54px 54px 24px; font-size:12px;}
  }

  .empty{
    text-align:center; padding:40px 20px; color:var(--muted);
  }
  .empty .display{font-size:22px; color:var(--chalk); margin-bottom:8px;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel-3); border:1px solid var(--gold-soft); color:var(--chalk);
    padding:10px 18px; border-radius:6px; font-size:13px; z-index:50; opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .footnote{color:var(--muted-2); font-size:11px; margin-top:4px;}
  .personbar{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .personbar label{margin:0;}

  .whoami{display:flex; align-items:center; gap:6px;}
  .whoami .tag{font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted-2);}
  .whoami select{
    background:var(--panel-3); border:1px solid var(--gold-soft); color:var(--gold);
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; padding:5px 8px; border-radius:4px;
  }
</style>
</head>
<body>

<header class="top">
  <div class="topwrap">
    <div class="brand">
      <div class="mark">Cover <span>Three</span></div>
      <div class="sub">Gin &middot; Guy &middot; Man &mdash; ATS confidence pool</div>
    </div>
  </div>
  <nav class="tabs" id="tabnav">
    <button data-tab="week" class="active">This Week</button>
    <button data-tab="standings">Standings</button>
    <button data-tab="history">History</button>
  </nav>
  <div class="hashline"></div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

y":"TCU","spread":-6.5,"homeScore":27,"awayScore":30,"winnerATS":"TCU","picks":{}}]}],"2026":[{"label":"Week 1","games":[{"home":"Michigan","away":"Western Michigan","spread":-27.5,"homeScore":"","awayScore":"","picks":{"Steve":{"pick":"Western Michigan","conf":3},"Matt":{"pick":"Michigan","conf":3}}},{"home":"Oregon","away":"Boise State","spread":-24.5,"homeScore":"","awayScore":"","picks":{"Dan":{"pick":"Oregon","conf":3},"Steve":{"pick":"Oregon","conf":2},"Matt":{"pick":"Oregon","conf":3}}},{"home":"Washington","away":"Washington State","spread":-23.5,"homeScore":"","awayScore":"","picks":{"Dan":{"pick":"Washington State","conf":3},"Steve":{"pick":"Washington State","conf":3}}},{"home":"Notre Dame","away":"Wisconsin","spread":-20.5,"homeScore":"","awayScore":"","picks":{"Dan":{"pick":"Notre Dame","conf":3},"Steve":{"pick":"Notre Dame","conf":3},"Matt":{"pick":"Notre Dame","conf":4}}},{"home":"Michigan State","away":"Toledo","spread":-10.5,"homeScore":"","awayScore":"","picks":{"Dan":{"pick":"Toledo","conf":3},"Steve":{"pick":"Michigan State","conf":2}}},{"home":"LSU","away":"Clemson","spread":-10.5,"homeScore":"","awayScore":"","picks":{"Dan":{"pick":"Clemson","conf":3},"Steve":{"pick":"Clemson","conf":2},"Matt":{"pick":"LSU","conf":5}}}]}]};
/* Cover Three — static, read-only viewer.
   No storage, no editing, no live picks. Every week's matchups, spreads,
   scores, and picks are baked into HISTORICAL at build time by build.js.
   Regenerate this file (and re-upload to GitHub Pages) whenever season data
   changes — see cli.js and WORKFLOW.md. */

const PEOPLE = ['Steve','Matt','Dan'];
const NICK = {Steve:'Gin', Matt:'Guy', Dan:'Man'};
function nick(p){ return NICK[p] || p; }
const PLAYER_COLOR = {Steve:'#E3B341', Matt:'#6FB3C9', Dan:'#C97B94'};

const POOL = 15;
const BANDS = [[1,3],[4,6],[7,9],[10,12],[13,15]];
const CURRENT_YEAR = String(new Date().getFullYear());

let state = { tab: 'week', year: CURRENT_YEAR, week: null, historyYear: 'career' };

/* ===================== scoring engine (identical to lib.js / the live app) ===================== */
function atsWinner(game){
  if (game.winnerATS) return game.winnerATS;
  if (game.homeScore == null || game.homeScore === '' || game.awayScore == null || game.awayScore === '') return null;
  const margin = Number(game.awayScore) - Number(game.homeScore);
  return margin < Number(game.spread) ? game.home : game.away;
}
function scoreWeekForPerson(games, person){
  let earned=0, placed=0, correct=0, bet=0;
  games.forEach(g=>{
    const pk = g.picks && g.picks[person];
    const winner = atsWinner(g);
    if (!pk || !pk.conf) return;
    placed += Number(pk.conf);
    bet += 1;
    if (winner && pk.pick === winner){ earned += Number(pk.conf); correct += 1; }
  });
  const allDecided = games.every(g => atsWinner(g) !== null);
  const bonus = (allDecided && placed>0 && earned===placed) ? bet : 0;
  return {earned, placed, correct, bet, bonus, total: earned+bonus, allDecided};
}
function seasonStandings(weeks){
  const totals = {};
  PEOPLE.forEach(p=> totals[p] = {points:0, correct:0, bet:0, bonus:0, weeksWon:0, weeksPlayed:0});
  weeks.forEach(w=>{
    const results = {};
    PEOPLE.forEach(p=> results[p] = scoreWeekForPerson(w.games, p));
    const allDecided = w.games.every(g=>atsWinner(g)!==null);
    let best=-Infinity, bestPeople=[];
    PEOPLE.forEach(p=>{
      const r = results[p];
      totals[p].points += r.total; totals[p].correct += r.correct; totals[p].bet += r.bet; totals[p].bonus += r.bonus;
      if (r.bet>0) totals[p].weeksPlayed += 1;
      if (allDecided && r.total>best){ best=r.total; bestPeople=[p]; }
      else if (allDecided && r.total===best){ bestPeople.push(p); }
    });
    if (allDecided && bestPeople.length===1) totals[bestPeople[0]].weeksWon += 1;
  });
  return totals;
}
function confidenceBandsByPerson(allGamesFlat){
  const out = {}; PEOPLE.forEach(p=> out[p] = BANDS.map(([lo,hi])=>({lo,hi,bet:0,won:0})));
  allGamesFlat.forEach(g=>{
    const winner = atsWinner(g);
    if (!winner) return;
    PEOPLE.forEach(p=>{
      const pk = g.picks && g.picks[p];
      if (!pk || !pk.conf) return;
      const conf = Number(pk.conf);
      const band = out[p].find(r=> conf>=r.lo && conf<=r.hi);
      if (!band) return;
      band.bet += 1;
      if (pk.pick === winner) band.won += 1;
    });
  });
  return out;
}
function fmtSpread(n){ n = Number(n); return n>0 ? '+'+n : String(n); }
function spreadLabel(game, side){ const s = Number(game.spread); return side==='home' ? fmtSpread(s) : fmtSpread(-s); }
function weeksForYear(year){ return HISTORICAL[year] || []; }

/* ===================== utils ===================== */
function esc(s){ return (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function gameStatusPill(decided){
  if (!decided) return `<span class="pill pending">Not final</span>`;
  return `<span class="pill win">${esc(decided)} covered</span>`;
}

/* ===================== rendering ===================== */
const app = document.getElementById('app');

function render(){
  document.querySelectorAll('#tabnav button').forEach(b=> b.classList.toggle('active', b.dataset.tab===state.tab));
  if (state.tab==='week') renderWeekTab();
  else if (state.tab==='standings') renderStandingsTab();
  else renderHistoryTab();
}

/* ---------- This Week (read-only) ---------- */
function renderWeekTab(){
  const weeks = weeksForYear(CURRENT_YEAR);
  const labels = weeks.map(w=>w.label);
  if (!state.week || !labels.includes(state.week)) state.week = labels.length ? labels[labels.length-1] : null;

  let html = `<div class="card">
    <div class="eyebrow">${esc(CURRENT_YEAR)} season</div>
    <div class="row"><div><label>Week</label><select id="weekSel">${labels.map(w=>`<option ${w===state.week?'selected':''}>${esc(w)}</option>`).join('') || '<option>No weeks yet</option>'}</select></div></div>
    <p class="footnote">Picks come in through Slack and get added here as they land &mdash; this page is read-only.</p>
  </div>`;

  if (!state.week){
    html += `<div class="card empty"><div class="display">No weeks yet</div><p>Check back once the season kicks off.</p></div>`;
    app.innerHTML = html;
    attachWeekSelector(labels);
    return;
  }

  const week = weeks.find(w=>w.label===state.week);
  const games = week.games;

  // Column order matches the Slack summary: Man, Guy, Gin.
  const COLS = ['Dan','Matt','Steve'];
  const results = {}; PEOPLE.forEach(p=> results[p] = scoreWeekForPerson(games, p));
  const allDecided = games.length>0 && games.every(g=>atsWinner(g)!==null);
  const anyPicks = games.some(g=>g.picks && Object.keys(g.picks).length);

  const rows = games.map(g=>{
    const decided = atsWinner(g);
    const hasScore = g.homeScore!==''&&g.homeScore!=null&&g.awayScore!==''&&g.awayScore!=null;
    const side = t => decided===t ? `<span class="covered">${esc(t)}</span>` : esc(t);
    const cells = COLS.map(p=>{
      const who = esc(nick(p)); // shown as a label only on the stacked mobile layout
      const pk = g.picks && g.picks[p];
      if (!pk) return `<td class="pick" data-who="${who}"><span class="pickcell none">&mdash;</span></td>`;
      const cls = !decided ? '' : (pk.pick===decided ? 'won' : 'lost');
      return `<td class="pick" data-who="${who}"><span class="pickcell ${cls}"><span class="team">${esc(pk.pick)}</span><span class="pts">${pk.conf}</span></span></td>`;
    }).join('');
    const lineTxt = g.spread!==''&&g.spread!=null ? `${esc(g.home)} ${fmtSpread(g.spread)}` : '&mdash;';
    const scoreTxt = hasScore ? `${g.awayScore}&ndash;${g.homeScore}` : '&mdash;';
    return `<tr class="${decided?'decided':''}">
      <td class="matchup">${g.away?side(g.away):'&mdash;'}<span class="at">@</span>${g.home?side(g.home):'&mdash;'}
        <span class="sub">${lineTxt}${hasScore?` &middot; ${scoreTxt}`:''}</span></td>
      <td class="line">${lineTxt}</td>
      <td class="result">${scoreTxt}</td>
      ${cells}
    </tr>`;
  }).join('');

  const anyDecided = games.some(g=>atsWinner(g)!==null);
  const best = Math.max(...COLS.map(p=>results[p].total));
  const summary = COLS.map(p=>{
    const r = results[p];
    const lead = allDecided && r.total===best && best>0;
    // Before kickoff "0 0/5" is noise — show what they've staked instead.
    const detail = !r.bet ? 'no picks'
      : !anyDecided ? `${r.placed} of ${POOL} pts on ${r.bet} game${r.bet===1?'':'s'}`
      : `${r.correct}/${r.bet}${r.bonus?` &middot; +${r.bonus} bonus`:''}`;
    return `<span><span class="who${lead?' lead':''}">${esc(nick(p))}</span>
      ${anyDecided?`<span class="pts">${r.total}</span> `:''}${detail}</span>`;
  }).join('');

  html += `<div class="card">
    <div class="eyebrow">${esc(state.week)} &middot; the board</div>
    <div class="scrollx"><table class="board">
      <thead><tr><th>Matchup</th><th class="lineh">Line</th><th class="resulth">Score</th>${COLS.map(p=>`<th class="person">${esc(nick(p))}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${anyPicks
      ? `<div class="wkline" style="margin-top:15px;">${summary}</div>
         <p class="footnote">${allDecided ? 'Final.' : 'Running totals &mdash; these move as games go final.'}</p>`
      : `<p class="hint" style="margin-top:15px;">No picks in yet.</p>`}
  </div>`;

  app.innerHTML = html;
  attachWeekSelector(labels);
}
function attachWeekSelector(labels){
  const sel = document.getElementById('weekSel');
  if (sel) sel.onchange = ()=>{ state.week = sel.value; renderWeekTab(); };
}

/* ---------- Standings ---------- */
function cumulativeChartHtml(weeks){
  const series = {}; PEOPLE.forEach(p=> series[p]=[0]);
  weeks.forEach(w=> PEOPLE.forEach(p=>{ const r=scoreWeekForPerson(w.games,p); series[p].push(series[p][series[p].length-1]+r.total); }));
  const labels = ['Start', ...weeks.map(w=>w.label||'')];
  const n = labels.length;
  const rawMax = Math.max(1, ...PEOPLE.flatMap(p=>series[p]));
  const step = rawMax<=50?10:rawMax<=150?25:rawMax<=400?50:100;
  const maxY = Math.ceil(rawMax/step)*step;
  const W=640,H=300,padL=38,padR=14,padT=14,padB=32;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xFor = i => padL + (n<=1?0:(i/(n-1))*plotW);
  const yFor = v => padT + plotH - (v/maxY)*plotH;
  let gridHtml='';
  for (let g=0; g*step<=maxY; g++){
    const val=g*step, y=yFor(val);
    gridHtml += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    gridHtml += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="10" fill="#5E6E65" font-family="IBM Plex Mono, monospace">${val}</text>`;
  }
  const showEvery = n<=9?1:Math.ceil(n/9);
  let xLabelsHtml='';
  labels.forEach((lab,i)=>{
    if (i!==0 && i!==n-1 && i%showEvery!==0) return;
    const text = i===0?'0':esc(String(lab).replace('Week ','W'));
    xLabelsHtml += `<text x="${xFor(i)}" y="${H-padB+16}" text-anchor="middle" font-size="10" fill="#5E6E65" font-family="Inter, sans-serif">${text}</text>`;
  });
  let linesHtml='', dotsHtml='';
  PEOPLE.forEach(p=>{
    const pts = series[p].map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
    linesHtml += `<polyline points="${pts}" fill="none" stroke="${PLAYER_COLOR[p]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    series[p].forEach((v,i)=> dotsHtml += `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="2.5" fill="${PLAYER_COLOR[p]}"/>`);
  });
  const legendHtml = PEOPLE.map(p=>`<span style="display:inline-flex; align-items:center; gap:6px; margin-right:16px;"><span style="width:10px;height:10px;border-radius:50%;background:${PLAYER_COLOR[p]};display:inline-block;"></span>${esc(nick(p))}</span>`).join('');
  return `<div class="card"><div class="eyebrow">Cumulative points by week</div>
    <div style="margin-bottom:10px; font-size:12px; color:var(--muted);">${legendHtml}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">${gridHtml}${linesHtml}${dotsHtml}${xLabelsHtml}</svg>
  </div>`;
}

function renderStandingsTab(){
  const years = Object.keys(HISTORICAL).sort((a,b)=>Number(b)-Number(a));
  let html = `<div class="card"><div class="eyebrow">Season</div>
    <div class="row"><div><label>Year</label><select id="stYearSel" class="mono">${years.map(y=>`<option ${y===state.year?'selected':''}>${esc(y)}</option>`).join('')}</select></div></div>
  </div>`;

  const weeks = weeksForYear(state.year);
  if (!weeks.length){
    html += `<div class="card empty"><div class="display">No games yet for ${esc(state.year)}</div></div>`;
    app.innerHTML = html; attachStandingsListeners(); return;
  }

  const totals = seasonStandings(weeks);
  const ranked = PEOPLE.slice().sort((a,b)=>totals[b].points-totals[a].points);
  const maxPts = Math.max(1, ...PEOPLE.map(p=>totals[p].points));

  const rows = ranked.map((p,i)=>`<tr class="standing-row ${i===0?'lead':''}">
    <td><span class="rank">${i+1}</span>${esc(nick(p))}</td>
    <td class="num">${totals[p].correct}/${totals[p].bet}</td>
    <td class="num">${totals[p].bonus}</td>
    <td class="num">${totals[p].weeksWon}</td>
    <td class="num" style="font-weight:700; color:${i===0?'var(--gold)':'var(--chalk)'};">${totals[p].points}</td>
  </tr>`).join('');

  const bars = ranked.map(p=>{
    const pct = Math.round((totals[p].points/maxPts)*100);
    return `<div class="barwrap"><div class="name">${esc(nick(p))}</div><div class="track"><div class="fill" style="width:${pct}%; background:${PLAYER_COLOR[p]};"></div></div><div class="amt">${totals[p].points}</div></div>`;
  }).join('');

  html += `<div class="card"><div class="eyebrow">${esc(state.year)} standings</div>
    <table><thead><tr><th>Player</th><th class="num">Record</th><th class="num">Bonus pts</th><th class="num">Weeks won</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>
  </div>
  ${cumulativeChartHtml(weeks)}
  <div class="card"><div class="eyebrow">Points on the board</div>${bars}</div>
  <div class="card"><div class="eyebrow">Stakes</div>
    <p class="hint">Winner takes $150 from the other two &mdash; $90 from last place, $60 from 2nd.</p>
    <p class="footnote">If the season ended today: ${esc(nick(ranked[0]))} +$150 &middot; ${esc(nick(ranked[1]))} &minus;$60 &middot; ${esc(nick(ranked[2]))} &minus;$90</p>
  </div>`;

  app.innerHTML = html;
  attachStandingsListeners();
}
function attachStandingsListeners(){
  const sel = document.getElementById('stYearSel');
  if (sel) sel.onchange = ()=>{ state.year = sel.value; renderStandingsTab(); };
}

/* ---------- History ---------- */
function renderHistoryTab(){
  const years = Object.keys(HISTORICAL).sort((a,b)=>Number(b)-Number(a));
  let html = `<div class="card"><div class="eyebrow">Browse</div>
    <div class="row"><div><label>Year</label><select id="hYearSel" class="mono">
      <option value="career">Career (all years)</option>
      ${years.map(y=>`<option value="${y}" ${y===state.historyYear?'selected':''}>${esc(y)}</option>`).join('')}
    </select></div></div>
  </div>`;

  let allWeeks = state.historyYear==='career' ? years.flatMap(y=>weeksForYear(y)) : weeksForYear(state.historyYear);

  if (!allWeeks.length){
    html += `<div class="card empty"><div class="display">Nothing here yet</div></div>`;
    app.innerHTML = html; attachHistoryListeners(); return;
  }

  const totals = seasonStandings(allWeeks);
  const ranked = PEOPLE.slice().sort((a,b)=>totals[b].points-totals[a].points);
  const rows = ranked.map((p,i)=>{
    const pct = totals[p].bet ? Math.round((totals[p].correct/totals[p].bet)*1000)/10 : 0;
    return `<tr class="standing-row ${i===0?'lead':''}">
      <td><span class="rank">${i+1}</span>${esc(nick(p))}</td>
      <td class="num">${totals[p].correct}/${totals[p].bet}</td>
      <td class="num">${pct}%</td>
      <td class="num">${totals[p].bonus}</td>
      <td class="num" style="font-weight:700; color:${i===0?'var(--gold)':'var(--chalk)'};">${totals[p].points}</td>
    </tr>`;
  }).join('');

  html += `<div class="card"><div class="eyebrow">${state.historyYear==='career'?'All-time':esc(state.historyYear)+' final'} standings</div>
    <table><thead><tr><th>Player</th><th class="num">Record</th><th class="num">Win %</th><th class="num">Bonus pts</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;

  const flatGames = []; allWeeks.forEach(w=>w.games.forEach(g=>flatGames.push(g)));
  const byPerson = confidenceBandsByPerson(flatGames);
  const bandRows = BANDS.map(([lo,hi],bi)=>{
    const cells = PEOPLE.map(p=>{
      const b = byPerson[p][bi];
      const pct = b.bet ? Math.round((b.won/b.bet)*1000)/10 : null;
      return `<td class="num">${b.bet===0?'—':pct+'%'}<span class="footnote" style="display:block;">${b.won}/${b.bet}</span></td>`;
    }).join('');
    return `<tr><td>${lo}&ndash;${hi} pts</td>${cells}</tr>`;
  }).join('');
  html += `<div class="card"><div class="eyebrow">Confidence calibration</div>
    <p class="hint">Win rate by point level, ${state.historyYear==='career'?'all seasons':esc(state.historyYear)} &mdash; how each of you actually does on big vs. small bets.</p>
    <div style="overflow-x:auto;"><table><thead><tr><th>Points bet</th>${PEOPLE.map(p=>`<th class="num">${esc(nick(p))}</th>`).join('')}</tr></thead><tbody>${bandRows}</tbody></table></div>
  </div>`;

  app.innerHTML = html;
  attachHistoryListeners();
}
function attachHistoryListeners(){
  const sel = document.getElementById('hYearSel');
  if (sel) sel.onchange = (e)=>{ state.historyYear = e.target.value; renderHistoryTab(); };
}

document.getElementById('tabnav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  state.tab = btn.dataset.tab;
  render();
});

render();

</script>
